name: Deploy to FTP

on:
  push:
    branches: [ main ]
  workflow_dispatch:   # bisa dijalankan manual dari tab Actions
    inputs:
      semua:
        description: >-
          Kirim SELURUH berkas, bukan hanya yang berubah. Dipakai untuk deploy
          pertama dan untuk memulihkan server yang isinya sudah menyimpang.
        type: boolean
        default: false

# Cegah dua deploy jalan bersamaan (push beruntun)
concurrency:
  group: deploy-ftp
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (dengan history untuk diff)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Hitung file yang berubah & dihapus
        id: diff
        run: |
          set -euo pipefail
          BEFORE="${{ github.event.before }}"
          ZERO="0000000000000000000000000000000000000000"
          # Run manual / push pertama / force-push: default bandingkan ke commit sebelumnya (bukan seluruh repo)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] \
             || [ -z "$BEFORE" ] || [ "$BEFORE" = "$ZERO" ] \
             || ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            BEFORE="$(git rev-parse HEAD~1 2>/dev/null || git hash-object -t tree /dev/null)"
          fi
          # Yang tidak perlu ada di server: konfigurasi CI dan berkas yang hanya
          # dibaca manusia di GitHub. README yang ikut naik akan tersaji di
          # https://shoesfast.id/README.md — bukan rahasia, tapi juga bukan halaman.
          EXCLUDE='^\.github/|^README\.md$|^\.gitignore$'

          # Diff tidak bisa menjawab "server ini masih kosong". Berkas yang sudah
          # lama ada di repo tidak muncul di diff mana pun, jadi deploy pertama
          # yang gagal meninggalkan situs yang tidak akan pernah terkirim sendiri.
          if [ "${{ inputs.semua }}" = "true" ]; then
            echo "Mode: SELURUH berkas"
            git ls-files | grep -Ev "$EXCLUDE" > changed.txt || true
            : > deleted.txt
            echo "--- File dikirim (upload) ---"; cat changed.txt || true
            exit 0
          fi

          echo "Diff dari $BEFORE ke ${{ github.sha }}"
          git diff --name-only --diff-filter=ACMR "$BEFORE" "${{ github.sha }}" | grep -Ev "$EXCLUDE" > changed.txt || true
          git diff --name-only --diff-filter=D    "$BEFORE" "${{ github.sha }}" | grep -Ev "$EXCLUDE" > deleted.txt || true
          echo "--- File berubah (upload) ---"; cat changed.txt || true
          echo "--- File dihapus (remove) ---"; cat deleted.txt || true

      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y lftp

      - name: Upload file yang berubah via FTP
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          # Situs ini duduk langsung di akar web, bukan di subfolder seperti
          # aplikasi backend. Tetap boleh ditimpa lewat secret kalau suatu saat
          # akarnya berpindah.
          REMOTE_PATH: ${{ secrets.FTP_REMOTE_PATH }}
        run: |
          set -euo pipefail
          PORT="${FTP_PORT:-21}"
          REMOTE_PATH="${REMOTE_PATH:-public_html}"

          # Secret yang kosong tidak membuat lftp berhenti — ia mencoba membuka
          # "ftp://:21", gagal diam-diam, lalu menjawab setiap unggahan dengan
          # "Not connected". Hasilnya 84 baris galat yang tidak satu pun
          # menyebutkan sebabnya. Berhenti di sini, dengan menyebut nama secret
          # yang kurang, dan tanpa mencetak isinya.
          KURANG=""
          [ -z "${FTP_HOST:-}" ] && KURANG="$KURANG FTP_HOST"
          [ -z "${FTP_USER:-}" ] && KURANG="$KURANG FTP_USER"
          [ -z "${FTP_PASSWORD:-}" ] && KURANG="$KURANG FTP_PASSWORD"
          if [ -n "$KURANG" ]; then
            echo "Secret berikut belum diisi di repo ini:$KURANG"
            echo "Pasang di Settings > Secrets and variables > Actions."
            echo "Secret TIDAK diturunkan antar repo — punya repo lain tidak berlaku di sini."
            exit 1
          fi

          # Bentuk secret, bukan isinya. "Not connected" pada setiap unggahan tidak
          # membedakan host salah ketik, host yang terlanjur memuat "ftp://", atau
          # newline yang ikut ter-paste — ketiganya gagal dengan cara yang sama.
          echo "host: ${#FTP_HOST} karakter, port $PORT, user: ${#FTP_USER} karakter"
          echo "tujuan: $REMOTE_PATH"
          case "$FTP_HOST" in
            ftp://*|http://*|https://*)
              echo "PERINGATAN: FTP_HOST memuat skema URL; isi host saja." ;;
          esac
          case "$FTP_HOST" in
            */*)
              echo "PERINGATAN: FTP_HOST memuat garis miring; isi host saja, tanpa jalur." ;;
          esac
          if [ "$FTP_HOST" != "$(printf %s "$FTP_HOST" | tr -d "[:space:]")" ]; then
            echo "PERINGATAN: FTP_HOST memuat spasi atau newline."
          fi

          # Koneksi diuji lebih dulu supaya sebabnya terbaca sekali, bukan terkubur
          # di bawah 84 baris "Not connected" yang semuanya cuma akibat.
          echo "--- Uji koneksi ---"
          UJI="set net:max-retries 1; set net:timeout 15;"
          UJI="$UJI set ssl:verify-certificate no;"
          UJI="$UJI set ftp:ssl-allow true; set ftp:ssl-protect-data true; set ftp:ssl-force false;"
          UJI="$UJI open -u \"$FTP_USER\",\"$FTP_PASSWORD\" ftp://$FTP_HOST:$PORT; pwd; bye"
          if ! lftp -c "$UJI"; then
            echo "Koneksi FTP gagal. Periksa FTP_HOST, FTP_PORT, FTP_USER, FTP_PASSWORD."
            exit 1
          fi

          # Bangun script perintah lftp (FTP dengan TLS/FTPS otomatis bila didukung)
          SCRIPT="set net:max-retries 2; set net:timeout 20;"
          SCRIPT="$SCRIPT set ssl:verify-certificate no;"
          SCRIPT="$SCRIPT set ftp:ssl-allow true; set ftp:ssl-protect-data true; set ftp:ssl-force false;"
          SCRIPT="$SCRIPT open -u \"$FTP_USER\",\"$FTP_PASSWORD\" ftp://$FTP_HOST:$PORT;"

          # Upload / update file yang berubah
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            dir=$(dirname "$f")
            # Berkas di akar (index.html, .htaccess, sitemap.xml) tidak boleh
            # dikirim ke "$REMOTE_PATH/." — sebagian server FTP memperlakukan
            # jalur itu sebagai direktori bernama titik.
            if [ "$dir" = "." ]; then
              dest="$REMOTE_PATH"
            else
              dest="$REMOTE_PATH/$dir"
              SCRIPT="$SCRIPT mkdir -p -f \"$dest\";"
            fi
            SCRIPT="$SCRIPT put -O \"$dest\" \"$f\";"
          done < changed.txt

          # Hapus file yang dihapus dari repo. Penting untuk situs ini: nama
          # berkas di `_next/static/` mengandung hash, jadi tiap build
          # meninggalkan berkas lama yang tidak akan pernah tertimpa.
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            SCRIPT="$SCRIPT rm -f \"$REMOTE_PATH/$f\";"
          done < deleted.txt

          SCRIPT="$SCRIPT bye"

          if [ ! -s changed.txt ] && [ ! -s deleted.txt ]; then
            echo "Tidak ada perubahan file untuk di-deploy."
            exit 0
          fi

          lftp -c "$SCRIPT"
          echo "Deploy selesai."
